[package]
name = "openscion-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A server-centric, content-addressed source control engine for agent-scale monorepos."
documentation = "https://docs.rs/openscion"
readme = "../../README.md"
keywords = ["vcs", "source-control", "monorepo", "changeset"]
categories = ["development-tools"]

[dependencies]
# The protocol: payload types and the protocol version. Re-exported wholesale
# from `src/lib.rs` so a consumer takes one dependency rather than two, and so
# `openscion_core::ObjectId` and `openscion_proto::ObjectId` are the same
# type.
openscion-proto = { workspace = true }
thiserror = { workspace = true }
# Hashes canonical encodings into object ids.
blake3 = { workspace = true }
# The SQLite-backed `MetadataStore`, behind the opt-in `sqlite` feature. Bundled
# so builds link a pinned SQLite rather than a system one.
rusqlite = { workspace = true, optional = true }
# Serializes a changeset into a row payload for the SQLite store. Only the
# `sqlite` feature needs it; the in-memory stores keep changesets in memory.
serde_json = { workspace = true, optional = true }

[features]
default = []
# A persistent metadata store backed by SQLite (`SqliteMetadataStore`).
sqlite = ["dep:rusqlite", "dep:serde_json"]

[lints]
workspace = true
