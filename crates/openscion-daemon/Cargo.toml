[package]
name = "openscion-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The OpenScion node daemon: a per-machine, bounded, read-through object store."
# Not published to crates.io; it ships as a server-side binary with its phase.
publish = false

[dependencies]
# The shared tier layer: the object ports, the read-through store, the
# upstream-concurrency bound, and the framed transport. The daemon assembles
# these into a per-machine process; it re-exports the surface it used to define.
openscion-tier = { workspace = true }
# The engine, for object ids (ObjectId) named in the daemon's snapshot codec and
# upstream wiring.
openscion-core = { workspace = true }
# The `openscion-daemon` binary's flag/env configuration, as the server.
clap = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Synchronous SIGINT/SIGTERM handling for the binary's graceful shutdown; see
# the workspace entry. Unix only — it backs the signal-driven snapshot write.
signal-hook = { workspace = true }

[dev-dependencies]
# The binary integration test builds an object id to request over the wire.
openscion-core = { workspace = true }

[lints]
workspace = true
