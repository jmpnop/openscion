[package]
name = "openscion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "opnscn, the OpenScion command-line client for server-centric, agent-scale source control."
documentation = "https://docs.rs/openscion"
homepage = "https://github.com/tinyhumansai/openscion"
readme = "README.md"
keywords = ["vcs", "source-control", "monorepo", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "opnscn"
path = "src/main.rs"

[dependencies]
# The engine and, through its re-export, the protocol payloads the client
# decodes and the bind rule it applies.
openscion-core = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }
# Request and response bodies, and the working copy's `.opnscn/state.json`.
serde = { workspace = true }
serde_json = { workspace = true }
# The filesystem watcher behind `opnscn watch`.
notify = { workspace = true }

[dev-dependencies]
# Tests run a real server in-process and point the client at it.
openscion-server = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
