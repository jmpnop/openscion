[workspace]
resolver = "3"
# Every crate in this repository lives under `crates/`, one directory per
# package, each directory named for the package it holds. There is no root
# package: the engine is `crates/openscion-core`, the same as any other member. Keeping the root virtual is what makes that uniform — a root package
# would make one crate structurally different from the rest for no reason other
# than history, and it is the arrangement the upstream template moved away from.
members = ["crates/*", "benchmarks"]
# `worktrees/` holds `git worktree` checkouts of this same repository; each
# contains a full copy of this manifest and every crate under it, so without
# this entry cargo walks into them and reports duplicate packages.
exclude = ["worktrees"]

# Shared package metadata. A member inherits a field with `field.workspace =
# true`, so the version the release workflow bumps is written in exactly one
# place and every crate moves together.
[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/openscion"

[workspace.dependencies]
# The protocol: every payload type that crosses a process boundary.
# `crates/openscion-core` depends on it and re-exports it, so a client that only
# makes calls takes this crate alone.
# `openscion-proto`, `openscion-core`, and `openscion` (the CLI) are published to
# crates.io, so their internal dependencies carry a `version` as well as a path.
# The release workflow rewrites these two versions together with
# `[workspace.package]`; do not edit them by hand.
openscion-proto = { path = "crates/openscion-proto", version = "0.2.1" }
# Derive macros for the crate-wide error type in `crates/openscion-core/src/error/`.
# Every dependency entry should carry a comment like this one saying why it is
# here.
thiserror = "2"
# Protocol payload types derive their wire representation.
serde = { version = "1", features = ["derive"] }
# The protocol's tests and doc examples pin each payload's JSON form, and the
# server and CLI encode and decode HTTP bodies with it.
serde_json = "1"
# The engine, so the server and CLI crates name the same types the library does.
openscion-core = { path = "crates/openscion-core", version = "0.2.1" }
# The engine's hash: every object, tree, and changeset id is BLAKE3 of its
# canonical encoding (`docs/specs/openscion-data-model.md#object-identifiers`).
# The CLI hashes working-copy files with it through the engine.
blake3 = "1"
# The SQLite-backed metadata store, behind openscion-core's opt-in `sqlite`
# feature. `bundled` compiles a pinned SQLite instead of linking the system
# one, so builds are reproducible and need no system library.
rusqlite = { version = "0.37", features = ["bundled"] }
# The CLI, taken by the benchmarks to drive `opnscn` in-process. Unpublished
# consumers only, so it needs no `version`.
openscion = { path = "crates/openscion" }
# The server crate, taken by the CLI's tests to talk to a real server
# in-process. Unpublished and used only as a dev-dependency, which `cargo
# publish` strips, so it needs no `version`.
openscion-server = { path = "crates/openscion-server" }
# The server's async runtime: the listener, request handling, and the shutdown
# signal. `signal` backs graceful shutdown on Ctrl-C and SIGTERM.
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
# The server's HTTP router. Only HTTP/1, JSON, and the tokio listener are used;
# the default features add form, query, and tracing extractors nothing needs.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
# Command-line parsing for the `openscion-server` and `opnscn` binaries.
clap = { version = "4", features = ["derive", "env"] }
# The CLI's blocking HTTP client, and the server tests' client. TLS is off
# until a deployment needs it; plain HTTP to a local or private server is the
# only supported setup today.
ureq = { version = "3", default-features = false, features = ["json"] }
# The CLI's filesystem watcher for `opnscn watch`: the maintained cross-platform
# watch crate (FSEvents, inotify, ReadDirectoryChangesW). The standard library
# has no filesystem-watch primitive, so this is the first-party choice. Only the
# recommended native backend is used; defaults stay on so each platform picks
# its native watcher rather than falling back to polling.
notify = "8"

# Lints apply to every member that opts in with `[lints] workspace = true`, and
# to every target of that member. CI runs clippy with `-D warnings`, so anything
# set to "warn" here fails the build in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
